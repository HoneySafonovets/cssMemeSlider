<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/favicon/favicon.ico">
  <link rel="stylesheet" href="./style.css">
  <title>cssMemeSlider</title>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="header__title">Meme Slider</h1>
    </header>
    <main class="main">

      <div class="main__container">
        <div class="slider__body">
          <img src="./assets/main/shame_1.jpg" alt="Shame" class="slider__item" id="slider__item-1">
          <img src="./assets/main/shame_3.jpg" alt="Any shame" class="slider__item" id="slider__item-2">
          <img src="./assets/main/meme_cry.png" alt="Cry meme" class="slider__item" id="slider__item-3">
          <img src="./assets/main/Code.jpg" alt="Code meme" class="slider__item" id="slider__item-4">
        </div>

        <div class="slider__info">
          <ul class="slider__list">
            <li class="slider__text" id="slider__text-1">That's too bad))))</li>
            <li class="slider__text" id="slider__text-2">It's a pity))</li>
            <li class="slider__text" id="slider__text-3">Are we?</li>
            <li class="slider__text" id="slider__text-4">Dev moment</li>
          </ul>
  
          <div class="slider__ui">
            <label for="slider__ui-1" class="slider__ui-area">
              <input class="slider__ui-input" type="radio" name="user-interface" value="radio-1" id="slider__ui-1" checked>
              <span class="slider__ui-item slider__hover-1"><span class="radio-pseudo"></span></span>
            </label>
            <label for="slider__ui-2" class="slider__ui-area">
              <input class="slider__ui-input" type="radio" name="user-interface" value="radio-2" id="slider__ui-2">
              <span class="slider__ui-item slider__hover-2"><span class="radio-pseudo"></span></span>
            </label>
            <label for="slider__ui-3" class="slider__ui-area">
              <input class="slider__ui-input" type="radio" name="user-interface" value="radio-3" id="slider__ui-3">
              <span class="slider__ui-item slider__hover-3"><span class="radio-pseudo"></span></span>
            </label>
            <label for="slider__ui-4" class="slider__ui-area">
              <input class="slider__ui-input" type="radio" name="user-interface" value="radio-4" id="slider__ui-4">
              <span class="slider__ui-item slider__hover-4"><span class="radio-pseudo"></span></span>
            </label>
          </div>
        </div>

      </div>

    </main>
    <footer class="footer">
      <a href="https://github.com/HoneySafonovets" class="footer__name">
        <img src="./assets/pngegg.png" alt="Github" class="footer__img">
        HoneySafonovets
      </a>
    </footer>
  </div>
</body>
</html>
